name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Commit lockfile if missing
        run: |
          if ! git diff --quiet --exit-code -- package-lock.json 2>/dev/null && [ -f package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add package-lock.json [skip ci]"
            git push
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_TRONGRID_API_KEY: ${{ secrets.EXPO_PUBLIC_TRONGRID_API_KEY }}
          EXPO_PUBLIC_CHANGENOW_API_KEY: ${{ secrets.EXPO_PUBLIC_CHANGENOW_API_KEY }}
          EXPO_PUBLIC_ONEINCH_API_KEY: ${{ secrets.EXPO_PUBLIC_ONEINCH_API_KEY }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk