name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Commit lockfile if missing
        run: |
          if [ -f package-lock.json ] && [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add package-lock.json [skip ci]"
            git push
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_TRONGRID_API_KEY: ${{ secrets.EXPO_PUBLIC_TRONGRID_API_KEY }}
          EXPO_PUBLIC_CHANGENOW_API_KEY: ${{ secrets.EXPO_PUBLIC_CHANGENOW_API_KEY }}
          EXPO_PUBLIC_ONEINCH_API_KEY: ${{ secrets.EXPO_PUBLIC_ONEINCH_API_KEY }}
          EXPO_PUBLIC_COINGECKO_API_KEY: ${{ secrets.EXPO_PUBLIC_COINGECKO_API_KEY }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Make debug build standalone (embed JS bundle, no Metro needed)
        run: |
          # By default RN's debug variant skips bundling the JS and expects
          # a live Metro server over USB/wifi. Setting debuggableVariants to
          # empty forces debug builds to embed the bundle too, so the APK is
          # fully self-contained and installable standalone on-device. It's
          # still a debug build (BuildConfig.DEBUG=true, JS dev warnings/
          # redbox enabled), so JS errors still surface a readable on-screen
          # stack trace instead of a bare native crash.
          sed -i 's/bundleCommand = "export:embed"/bundleCommand = "export:embed"\n    debuggableVariants = []/' android/app/build.gradle

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Configure release signing
        working-directory: android
        run: |
          cat >> gradle.properties << EOF
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
